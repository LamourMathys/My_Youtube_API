<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Logo_moche.png">
  <title>YouTubeurs</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header class="header">
    <img src="Logo_moche.png" alt="Logo" onerror="this.style.display='none'">
    <h1>Liste des YouTubeurs</h1>
  </header>

  <div class="login-box">
    <div id="loginForm">
      <h3>Connexion Admin</h3>
      <input type="text" id="username" placeholder="Identifiant">
      <input type="password" id="password" placeholder="Mot de passe">
      <button id="loginBtn">Connexion</button>
      <div id="loginMsg"></div>
    </div>
    <div id="loggedSection" style="display: none;">
      <p style="margin: 0 0 10px 0; color: green;">Connecté en tant qu'admin</p>
      <button id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <nav class="nav">
    <a id="prev">← Précédent</a> | <a id="next">Suivant →</a>
  </nav>

  <div id="liste" class="grid">Chargement...</div>

  <script>
    const page = Number(new URLSearchParams(location.search).get('page')) || 1

    document.getElementById('prev').href = '?page=' + Math.max(1, page - 1)
    document.getElementById('next').href = '?page=' + (page + 1)

    fetch('/YTAPI?page=' + page)
      .then(res => res.json())
      .then(result => {
        document.getElementById('liste').innerHTML = result.data
          .map(y => `
            <div class="box">
              <h3 style="margin-top: 0;">${y.nom_chaine}</h3>
              <p><strong>Abonnés :</strong> ${y.nombre_abonnes}</p>
              <p><strong>Thème :</strong> ${y.theme || '?'}</p>
              <p><strong>Classement :</strong> #${y.classement || y.id}</p>
            </div>
          `)
          .join('')
      })

    function updateAuthUI() {
      const token = localStorage.getItem('token')
      if (token) {
        document.getElementById('loginForm').style.display = 'none'
        document.getElementById('loggedSection').style.display = 'block'
      } else {
        document.getElementById('loginForm').style.display = 'block'
        document.getElementById('loggedSection').style.display = 'none'
      }
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const username = document.getElementById('username').value
      const password = document.getElementById('password').value
      const msg = document.getElementById('loginMsg')

      fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.token) {
          localStorage.setItem('token', data.token)
          msg.textContent = ''
          updateAuthUI()
        } else {
          msg.className = 'msg-error'
          msg.textContent = data.error || 'Erreur de connexion'
        }
      })
      .catch(() => {
        msg.className = 'msg-error'
        msg.textContent = 'Erreur serveur'
      })
    })

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token')
      updateAuthUI()
    })

    updateAuthUI()
  </script>

</body>
</html>
