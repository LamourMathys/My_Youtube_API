<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Logo.png">
  <title>YTAPI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black min-h-screen p-6 font-sans">

  <header class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-gray-200">
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-6 bg-red-600 rounded-lg flex items-center justify-center">
        <svg class="w-3.5 h-3.5 text-white ml-0.5 fill-current" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold tracking-tight">YTAPI</h1>
    </div>

    <div class="flex items-center flex-1 max-w-lg mx-auto w-full">
      <div class="flex w-full">
        <input type="number" id="searchId" placeholder="Rechercher par ID..." min="1" class="w-full px-4 py-2 border border-gray-300 rounded-l-full text-sm focus:outline-none focus:border-blue-500 bg-gray-50/50">
        <button id="searchBtn" class="px-5 py-2 border border-l-0 border-gray-300 bg-gray-100 hover:bg-gray-200 rounded-r-full text-gray-600 transition flex items-center justify-center cursor-pointer" title="Rechercher">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </div>

      <button id="toggleCreateBtn" class="ml-2 w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-700 transition cursor-pointer shrink-0" title="Ajouter un YouTubeur">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
      </button>

      <button id="resetBtn" style="display: none;" class="ml-2 text-xs text-neutral-600 hover:text-black border border-gray-300 hover:bg-gray-100 rounded-full px-3 py-2 whitespace-nowrap cursor-pointer transition">
        ← Tout afficher
      </button>
      <span id="searchMsg" class="ml-2 text-xs text-red-500 whitespace-nowrap"></span>
    </div>
  </header>

  <div class="mb-6 text-sm">
    <div id="loginForm" class="flex flex-wrap items-center gap-2">
      <input type="text" id="username" placeholder="Identifiant" class="border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none">
      <input type="password" id="password" placeholder="Mot de passe" class="border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none">
      <button id="loginBtn" class="bg-black text-white rounded px-3 py-1 text-sm hover:bg-gray-800 cursor-pointer">Connexion</button>
      <a href="/auth/login" class="border border-gray-300 rounded px-3 py-1 text-sm hover:bg-gray-100 text-gray-700">Google</a>
      <span id="loginMsg" class="text-red-500 text-xs"></span>
    </div>

    <div id="loggedSection" style="display: none;" class="flex items-center gap-3">
      <span class="text-green-600 font-medium">Connecté en tant qu'admin</span>
      <button id="logoutBtn" class="border border-gray-300 rounded px-2.5 py-1 text-xs hover:bg-gray-100 cursor-pointer">Déconnexion</button>
    </div>
  </div>

  <div id="createSection" style="display: none;" class="mb-6 p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm">
    <div class="flex flex-wrap items-center gap-2">
      <input type="text" id="newNom" placeholder="Nom de la chaîne *" class="border border-gray-300 rounded px-2.5 py-1 text-sm bg-white focus:outline-none">
      <input type="text" id="newSubs" placeholder="Abonnés (ex: 10M)" class="border border-gray-300 rounded px-2.5 py-1 text-sm bg-white focus:outline-none">
      <input type="text" id="newTheme" placeholder="Thème (ex: Gaming)" class="border border-gray-300 rounded px-2.5 py-1 text-sm bg-white focus:outline-none">
      <button id="createBtn" class="bg-black text-white rounded px-3 py-1 text-sm hover:bg-gray-800 cursor-pointer">Ajouter</button>
      <span id="createMsg" class="text-xs"></span>
    </div>
  </div>

  <div id="liste" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-7 mb-8">
    Chargement...
  </div>

  <nav class="flex items-center justify-center gap-4 text-sm font-medium" id="paginationNav">
    <a id="prev" class="px-5 py-2 bg-neutral-800 hover:bg-neutral-700 text-white rounded-full transition cursor-pointer">← Précédent</a>
    <a id="next" class="px-5 py-2 bg-neutral-800 hover:bg-neutral-700 text-white rounded-full transition cursor-pointer">Suivant →</a>
  </nav>

  <script src="js/auth.js"></script>
  <script src="js/list.js"></script>
  <script src="js/search.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
