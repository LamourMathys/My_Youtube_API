<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Logo_moche.png">
  <title>YouTubeurs</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header class="header">
    <img src="Logo_moche.png" alt="Logo" onerror="this.style.display='none'">
    <h1>Liste des YouTubeurs</h1>
  </header>

  <div class="login-box">
    <div id="loginForm">
      <h3>Connexion Admin</h3>
      <input type="text" id="username" placeholder="Identifiant">
      <input type="password" id="password" placeholder="Mot de passe">
      <button id="loginBtn">Connexion</button>
      <div id="loginMsg"></div>
      <a href="/auth/login" class="google-btn">Connect with Google</a>
    </div>
    <div id="loggedSection" style="display: none;">
      <p style="margin: 0 0 10px 0; color: green;">Connecté en tant qu'admin</p>
      <button id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="create-box" id="createSection" style="display: none;">
    <h3>Ajouter un YouTubeur</h3>
    <input type="text" id="newNom" placeholder="Nom de la chaîne *">
    <input type="text" id="newSubs" placeholder="Abonnés (ex: 10M)">
    <input type="text" id="newTheme" placeholder="Thème (ex: Gaming)">
    <button id="createBtn" class="action-btn">Ajouter</button>
    <div id="createMsg" style="margin-top: 6px;"></div>
  </div>

  <div class="search-box">
    <input type="number" id="searchId" placeholder="ID (ex: 1)" min="1">
    <button id="searchBtn">Rechercher</button>
    <button id="resetBtn" style="display: none;">← Voir toute la liste</button>
    <span id="searchMsg" class="msg-error"></span>
  </div>

  <nav class="nav" id="paginationNav">
    <a id="prev">← Précédent</a> | <a id="next">Suivant →</a>
  </nav>

  <div id="liste" class="grid">Chargement...</div>

  <script src="js/auth.js"></script>
  <script src="js/list.js"></script>
  <script src="js/search.js"></script>
  <script src="js/create.js"></script>

</body>
</html>
